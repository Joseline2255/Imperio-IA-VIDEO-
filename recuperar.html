</head><body><main class="card"><div class="eyebrow">IMPERIO AI VIDEO</div><h1>Recuperar acceso</h1><p class="intro">Recupera tu contraseña sin perder tu cuenta de administrador.</p>

</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(()=>{
const project='https://xmxirddbswlcgirtqzfj.supabase.co';
const publicKey='sb_publishable_Vg109_YO0-BBegk5ZLFCRQ_8OWwcOiO';
const status=document.getElementById('status'),requestForm=document.getElementById('requestForm'),passwordForm=document.getElementById('passwordForm');
if(!window.supabase?.createClient){status.textContent='No se pudo cargar Supabase. Revisa la conexión.';return}
const client=window.supabase.createClient(project,publicKey,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true}});

else{status.textContent='Escribe tu correo y solicita un enlace nuevo. Si ya abriste el enlace, la página mostrará el formulario para cambiar la contraseña.'}
requestForm.addEventListener('submit',async(e)=>{e.preventDefault();const btn=requestForm.querySelector('button');btn.disabled=true;status.textContent='Solicitando correo…';try{const {error}=await client.auth.resetPasswordForEmail(document.getElementById('email').value.trim(),{redirectTo:location.origin+location.pathname});status.textContent=error?'No se pudo enviar: '+error.message:'Si existe esta cuenta, recibirás un enlace. Revisa también Spam y abre el mensaje en el mismo navegador.'}catch(err){status.textContent='Error de conexión: '+err.message}finally{btn.disabled=false}});

})();
